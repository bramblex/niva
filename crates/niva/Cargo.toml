[package]
name = "niva"
description = "A lightweight Tauri alternative"
version = "1.0.0"
edition = "2024"

[profile.release]
opt-level = "z"   # 优化体积
lto = true        # 启用 Link Time Optimization (LTO)
panic = "abort"   # 减少 panic 处理代码
strip = true      # 自动去除调试信息（Rust 1.64+）
codegen-units = 1 # 降低并行代码生成，提高优化效果


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
anyhow = "*"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tiny_http = "*"
winit = { version = "*" }
wry = { version = "*", default-features = false, features = [
    "os-webview",
    "drag-drop",
    "devtools",
    "transparent",
    "fullscreen",
] }
ureq = { version = "3", default-features = false, features = ["native-tls", "charset", "gzip"] }
native-tls = "*"
tray-icon = { version =  "*", features = ["serde"]}
flate2 = "1" # 用于解压资源

