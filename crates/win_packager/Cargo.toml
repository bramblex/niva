[package]
name = "win_packager"
version = "0.1.0"
edition = "2024"
description = "Windows exe resource packager replacing ResourceHacker (RCDATA + icon + version)."
license = "MIT"

[dependencies]
anyhow = "1.0.104"
flate2 = "1.1.10"
serde_json = "1.0.151"
image = { version = "0.25.10", default-features = false, features = ["png"] }
png = "0.18.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
