[package]
name = "niva-packager"
version = "0.9.9"
edition = "2024"
license = "MIT"
description = "Cross-host packaging for precompiled Niva runtimes"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tempfile = "3"
flate2 = "1.1.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive"] }
win_packager = { path = "../win_packager" }
editpe = { version = "=0.2.3", default-features = false, features = ["std"] }
apple-codesign = { version = "=0.29.0", default-features = false }
icns = { version = "=0.5.0", default-features = false, features = ["pngio"] }
plist = "1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
