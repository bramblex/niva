name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: npm test --workspace=packages/node-compat
      - run: node --test packages/devtools/scripts/api-contract.test.mjs
      - run: node --test packages/devtools/scripts/bridge-api-overrides.test.mjs
      - run: node --test packages/devtools/scripts/macos-window-cases.test.mjs
      - run: node --test packages/devtools/scripts/macos-public-cases.test.mjs
      - run: node --test packages/devtools/scripts/macos-bridge-cases.test.mjs
      - run: node --check examples/node-compat-macos-smoke/cases.js
      - if: runner.os == 'macOS'
        run: python3 -B -m unittest examples/macos-api-smoke/test_runner.py
      - if: runner.os == 'macOS'
        run: python3 -B -m unittest discover -s examples/node-compat-macos-smoke -p 'test_runner.py'
      - run: node --test packages/devtools/scripts/bridge-stream.test.mjs
      - run: npm run build --workspace=packages/devtools
      - run: cargo build --release -p niva
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bytes = (Get-Item target/release/niva.exe).Length
          Write-Host "Windows release binary: $bytes bytes"
          if ($bytes -ge 3500000) { exit 1 }
      - if: runner.os == 'macOS'
        shell: bash
        run: |
          bytes=$(stat -f%z target/release/niva)
          echo "macOS release binary: $bytes bytes"
          test "$bytes" -lt 3300000

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/website/package-lock.json
      - run: npm ci
        working-directory: packages/website
      - run: npm run typecheck
        working-directory: packages/website
      - run: npm run build
        working-directory: packages/website
