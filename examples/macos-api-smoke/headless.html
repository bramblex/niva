<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Niva macOS headless safe API smoke</title>
    <script src="fixture-protocol.js"></script>
  </head>
  <body>
    <h1>Niva headless safe API smoke</h1>
    <script>
      (() => {
        const fs = require("node:fs/promises");
        const path = require("node:path");
        const os = require("node:os");
        const process = require("node:process");
        const childProcess = require("node:child_process");
        const covered = [];
        let running = false;
        let activeMethod = null;
        let activePhase = null;
        let runProgressUrl = null;

        function assert(condition, message) {
          if (!condition) throw new Error(message);
        }

        function equal(actual, expected, message) {
          assert(actual === expected, `${message}: got ${JSON.stringify(actual)}, expected ${JSON.stringify(expected)}`);
        }

        const send = (name, data) => NivaFixture.send(name, data);

        function reportProgress(progressUrl, method, phase) {
          if (typeof progressUrl !== "string" || !progressUrl) return;
          const query = new URLSearchParams({ method, phase });
          fetch(`${progressUrl}?${query.toString()}`, { method: "GET", mode: "cors", cache: "no-store", keepalive: true }).catch(() => {});
        }

        async function boundedPhase(method, phase, deadline, operation) {
          activeMethod = method;
          activePhase = phase;
          const remaining = deadline - Date.now();
          if (remaining <= 0) {
            const error = new Error(`headless API timeout: ${method} (${phase})`);
            error.code = "HEADLESS_TIMEOUT";
            error.phase = phase;
            throw error;
          }
          let timer = null;
          const timeout = new Promise((_, reject) => {
            timer = setTimeout(() => {
              const error = new Error(`headless API timeout: ${method} (${phase})`);
              error.code = "HEADLESS_TIMEOUT";
              error.phase = phase;
              reject(error);
            }, remaining);
          });
          try {
            return await Promise.race([Promise.resolve().then(operation), timeout]);
          } finally {
            if (timer !== null) clearTimeout(timer);
          }
        }

        async function checkMethod(method, assertion, operation) {
          const deadline = Date.now() + 10000;
          activeMethod = method;
          reportProgress(runProgressUrl, method, "start");
          const value = await boundedPhase(method, "operation", deadline, operation);
          covered.push({ method, assertion });
          reportProgress(runProgressUrl, method, "complete");
          activeMethod = null;
          activePhase = null;
          return value;
        }

        function safeError(error, context) {
          let message = typeof error?.message === "string" ? error.message : String(error);
          const fields = context || {};
          for (const key of ["fsRoot", "tempRoot", "expectedCwd", "expectedExe", "expectedConfig", "expectedResources"]) {
            if (typeof fields[key] === "string" && fields[key]) message = message.replaceAll(fields[key], "<temporary-path>");
          }
          message = message.replace(/\/__niva_fs\/[^/]+/g, "/__niva_fs/<redacted>");
          const rawCode = error && typeof error === "object" ? error.code : null;
          const code = typeof rawCode === "number" || typeof rawCode === "string" ? String(rawCode).slice(0, 48) : null;
          const phase = error && typeof error.phase === "string" ? error.phase : activePhase;
          return { code, message: message.slice(0, 512), method: activeMethod, phase, coverage: covered };
        }

        async function testProcessOs(data) {
          const { tempRoot, expectedCwd, expectedExe, expectedConfig, expectedResources, expectedVersion } = data;
          const pid = await checkMethod("process.pid", "returns a positive child process id", async () => {
            const value = process.pid;
            assert(Number.isInteger(value) && value > 0, "process.pid must return a positive integer");
            return value;
          });

          await checkMethod("process.cwd", "matches the runner-selected repository working directory", async () => {
            equal(process.cwd(), expectedCwd, "process.cwd");
          });

          await checkMethod("process.execPath", "matches the resolved Niva binary path", async () => {
            equal(process.execPath, expectedExe, "process.execPath");
          });

          await checkMethod("process.argv", "contains this run's isolated config/resource paths", async () => {
            const args = process.argv;
            assert(Array.isArray(args), "process.args must return an array");
            assert(args.includes(`--config=${expectedConfig}`), "process.argv must include the isolated config path");
            assert(args.includes(`--resource=${expectedResources}`), "process.argv must include the isolated resource path");
          });

          await checkMethod("process.version", "reports the Node compatibility target separately from the actual Niva version", async () => {
            equal(process.version, `v${process.versions.nodeCompat}`, "process.version target");
            equal(process.versions.node, process.versions.nodeCompat, "Node compatibility target");
            equal(process.versions.niva, expectedVersion, "actual Niva version");
          });

          await checkMethod("Niva.os.info", "returns macOS plus non-empty architecture/version strings", async () => {
            const info = Niva.os.info;
            assert(info && typeof info.os === "string" && info.os.toLowerCase().includes("mac"), "os.info must identify macOS");
            assert(typeof info.arch === "string" && info.arch.length > 0 && typeof info.version === "string" && info.version.length > 0, "os.info must include architecture and OS version");
          });

          await checkMethod("Niva.os.dirs", "returns an isolated per-run temp path and an app data path", async () => {
            const dirs = await Niva.os.dirs();
            assert(dirs && typeof dirs.temp === "string" && dirs.temp.startsWith(tempRoot), "os.dirs.temp must be under this run's temporary directory");
            assert(typeof dirs.data === "string" && dirs.data.length > 0, "os.dirs.data must be a non-empty path");
          });

          await checkMethod("path.sep", "returns the macOS path separator", async () => {
            equal(path.sep, "/", "path.sep");
          });

          await checkMethod("os.EOL", "returns the macOS line ending", async () => {
            equal(os.EOL, "\n", "os.EOL");
          });

          await checkMethod("Niva.bridge.callOsLocale", "returns a non-empty system locale string", async () => {
            const locale = await Niva.bridge.call("os.locale", []);
            assert(typeof locale === "string" && locale.length > 0, "os.locale must return a non-empty locale string");
          });
          return pid;
        }

        async function testResource() {
          const resource = Niva.resource;
          await checkMethod("Niva.resource.exists", "finds a file in the isolated debug resource tree", async () => {
            equal(await resource.exists("headless-resource.txt"), true, "resource.exists for fixture resource");
          });

          await checkMethod("Niva.resource.read", "reads and decodes the isolated fixture resource", async () => {
            equal(await resource.read("headless-resource.txt", "utf8"), "headless-resource-ok\n", "resource.read");
          });
        }

        async function testFs(fsRoot) {
          const work = path.join(fsRoot, "work");
          const simpleDir = path.join(work, "simple");
          const nestedDir = path.join(work, "nested", "a", "b");
          const file = path.join(simpleDir, "sample.txt");
          const copied = path.join(simpleDir, "copy.txt");
          const moved = path.join(nestedDir, "moved.txt");
          const exists = async (target) => fs.access(target).then(() => true, () => false);

          await checkMethod("fs.access", "observes missing, created, moved, and removed paths", async () => {
            equal(await exists(work), false, "fs.access before setup");
          });

          await checkMethod("fs.mkdir", "creates temporary directories", async () => {
            await fs.mkdir(work);
            await fs.mkdir(simpleDir);
            assert(await exists(work) && await exists(simpleDir), "fs.mkdir must create both direct temporary directories");
          });

          await checkMethod("fs.mkdirRecursive", "creates nested temporary directories", async () => {
            await fs.mkdir(nestedDir, { recursive: true });
            assert(await exists(nestedDir), "fs.mkdir recursive must create the nested leaf directory");
          });

          const firstText = "headless-alpha\n";
          const finalText = `${firstText}headless-beta\n`;
          await checkMethod("fs.writeFile", "writes a new file under the temporary fixture root", async () => {
            await fs.writeFile(file, firstText, "utf8");
          });

          await checkMethod("fs.readFile", "reads exact UTF-8 file contents from the temporary fixture root", async () => {
            equal(await fs.readFile(file, "utf8"), firstText, "fs.readFile initial content");
          });

          await checkMethod("fs.appendFile", "appends UTF-8 content and preserves the preceding bytes", async () => {
            await fs.appendFile(file, "headless-beta\n", "utf8");
            equal(await fs.readFile(file, "utf8"), finalText, "fs.appendFile readback");
          });

          await checkMethod("fs.stat", "reports file type and exact byte size", async () => {
            const stat = await fs.stat(file);
            assert(stat.isFile() && !stat.isDirectory() && stat.size === new TextEncoder().encode(finalText).length, "fs.stat must report the file type and exact byte length");
            assert((await fs.stat(work)).isDirectory() && (await fs.stat(simpleDir)).isDirectory() && (await fs.stat(nestedDir)).isDirectory(), "fs.stat must identify fixture directories");
          });

          await checkMethod("fs.copyFile", "copies the fixture file and preserves exact contents", async () => {
            await fs.copyFile(file, copied);
            equal(await fs.readFile(copied, "utf8"), finalText, "fs.copyFile readback");
          });

          await checkMethod("fs.rename", "moves the fixture file, removes its source, and preserves contents", async () => {
            await fs.rename(copied, moved);
            equal(await exists(copied), false, "fs.rename source removal");
            equal(await fs.readFile(moved, "utf8"), finalText, "fs.rename destination readback");
          });

          await checkMethod("fs.readdir", "lists direct files in the isolated directory", async () => {
            const directEntries = await fs.readdir(simpleDir);
            assert(directEntries.includes("sample.txt") && !directEntries.includes("moved.txt"), "fs.readDir must list only direct fixture files");
          });

          await checkMethod("fs.readdirRecursive", "lists recursive file paths under the isolated directory", async () => {
            const recursiveEntries = [];
            async function walk(directory) {
              for (const entry of await fs.readdir(directory, { withFileTypes: true })) {
                const fullPath = path.join(directory, entry.name);
                if (entry.isDirectory()) await walk(fullPath);
                else if (entry.isFile()) recursiveEntries.push(path.relative(work, fullPath));
              }
            }
            await walk(work);
            const recursiveSet = new Set(recursiveEntries);
            assert(recursiveSet.has("simple/sample.txt") && recursiveSet.has("nested/a/b/moved.txt"), "fs.readDirAll must list recursive file paths");
          });

          await checkMethod("fs.rm", "removes fixture files and confirms their paths are absent", async () => {
            await fs.rm(file);
            await fs.rm(moved);
            equal(await exists(file), false, "fs.rm source");
            equal(await exists(moved), false, "fs.rm moved file");
          });
        }

        async function run(data) {
          const { group, progressUrl, fsRoot } = data;
          runProgressUrl = progressUrl;
          let pid = null;
          let resourcePath = null;
          let fsContents = null;
          if (group === "process-os" || group === "all-sequential") pid = await testProcessOs(data);
          if (group === "resource" || group === "all-sequential") {
            await testResource();
            resourcePath = "headless-resource.txt";
          }
          if (group === "fs" || group === "all-sequential") {
            await testFs(fsRoot);
            fsContents = "removed";
          }
          if (!["process-os", "resource", "fs", "all-sequential"].includes(group)) {
            throw new Error(`unknown headless group: ${group}`);
          }
          const result = { group, coverage: covered.slice() };
          if (pid !== null) result.pid = pid;
          if (resourcePath !== null) result.resourcePath = resourcePath;
          if (fsContents !== null) result.fsContents = fsContents;
          await boundedPhase("headless-result", "result-send", Date.now() + 5000, () => send("headless-result", result));
        }

        async function handle(message) {
          if (!message || message.name !== "headless-command") return;
          const data = message.data || {};
          try {
            if (data.command === "run" && !running) {
              running = true;
              await run(data);
            } else if (data.command === "echo") {
              await send("headless-echo-result", { nonce: data.nonce });
            } else if (data.command === "exit") {
              await send("headless-exit-started", { coverage: covered.map(item => item.method) });
              setTimeout(() => NivaFixture.exit(0), 250);
            }
          } catch (error) {
            const details = safeError(error, data);
            await boundedPhase(activeMethod || "headless-error", "error-send", Date.now() + 3000, () => send("headless-error", details)).catch(() => {});
          }
        }

        NivaFixture.onCommand("headless-command", (data) => handle({ name: "headless-command", data }));
        NivaFixture.ready("headless", { path: location.pathname }).then(() => send("headless-ready", { path: location.pathname })).catch(async error => {
          await send("headless-error", safeError(error, null));
        });
      })();
    </script>
  </body>
</html>
