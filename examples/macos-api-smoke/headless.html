<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Niva macOS headless safe API smoke</title>
  </head>
  <body>
    <h1>Niva headless safe API smoke</h1>
    <script>
      (() => {
        const covered = [];
        let running = false;
        let activeMethod = null;
        let activePhase = null;
        let runProgressUrl = null;

        function assert(condition, message) {
          if (!condition) throw new Error(message);
        }

        function equal(actual, expected, message) {
          assert(actual === expected, `${message}: got ${JSON.stringify(actual)}, expected ${JSON.stringify(expected)}`);
        }

        const send = (name, data) => Niva.api.host.send(name, data);

        function reportProgress(progressUrl, method, phase) {
          if (typeof progressUrl !== "string" || !progressUrl) return;
          const query = new URLSearchParams({ method, phase });
          fetch(`${progressUrl}?${query.toString()}`, { method: "GET", mode: "cors", cache: "no-store", keepalive: true }).catch(() => {});
        }

        async function boundedPhase(method, phase, deadline, operation) {
          activeMethod = method;
          activePhase = phase;
          const remaining = deadline - Date.now();
          if (remaining <= 0) {
            const error = new Error(`headless API timeout: ${method} (${phase})`);
            error.code = "HEADLESS_TIMEOUT";
            error.phase = phase;
            throw error;
          }
          let timer = null;
          const timeout = new Promise((_, reject) => {
            timer = setTimeout(() => {
              const error = new Error(`headless API timeout: ${method} (${phase})`);
              error.code = "HEADLESS_TIMEOUT";
              error.phase = phase;
              reject(error);
            }, remaining);
          });
          try {
            return await Promise.race([Promise.resolve().then(operation), timeout]);
          } finally {
            if (timer !== null) clearTimeout(timer);
          }
        }

        async function checkMethod(method, assertion, operation) {
          const deadline = Date.now() + 10000;
          activeMethod = method;
          reportProgress(runProgressUrl, method, "start");
          const value = await boundedPhase(method, "operation", deadline, operation);
          covered.push({ method, assertion });
          reportProgress(runProgressUrl, method, "complete");
          activeMethod = null;
          activePhase = null;
          return value;
        }

        function safeError(error, context) {
          let message = typeof error?.message === "string" ? error.message : String(error);
          const fields = context || {};
          for (const key of ["fsRoot", "tempRoot", "expectedCwd", "expectedExe", "expectedConfig", "expectedResources"]) {
            if (typeof fields[key] === "string" && fields[key]) message = message.replaceAll(fields[key], "<temporary-path>");
          }
          message = message.replace(/\/__niva_fs\/[^/]+/g, "/__niva_fs/<redacted>");
          const rawCode = error && typeof error === "object" ? error.code : null;
          const code = typeof rawCode === "number" || typeof rawCode === "string" ? String(rawCode).slice(0, 48) : null;
          const phase = error && typeof error.phase === "string" ? error.phase : activePhase;
          return { code, message: message.slice(0, 512), method: activeMethod, phase, coverage: covered };
        }

        async function testProcessOs(data) {
          const { tempRoot, expectedCwd, expectedExe, expectedConfig, expectedResources, expectedVersion } = data;
          const processApi = Niva.api.process;
          const os = Niva.api.os;

          const pid = await checkMethod("process.pid", "returns a positive child process id", async () => {
            const value = await processApi.pid();
            assert(Number.isInteger(value) && value > 0, "process.pid must return a positive integer");
            return value;
          });

          await checkMethod("process.currentDir", "matches the runner-selected repository working directory", async () => {
            equal(await processApi.currentDir(), expectedCwd, "process.currentDir");
          });

          await checkMethod("process.currentExe", "matches the resolved Niva binary path", async () => {
            equal(await processApi.currentExe(), expectedExe, "process.currentExe");
          });

          await checkMethod("process.args", "contains --stdio and this run's isolated config/resource paths", async () => {
            const args = await processApi.args();
            assert(Array.isArray(args), "process.args must return an array");
            assert(args.includes("--stdio"), "process.args must include --stdio");
            assert(args.includes(`--debug-config=${expectedConfig}`), "process.args must include the isolated config path");
            assert(args.includes(`--debug-resource=${expectedResources}`), "process.args must include the isolated resource path");
          });

          await checkMethod("process.version", "matches the niva crate package version", async () => {
            equal(await processApi.version(), expectedVersion, "process.version");
          });

          await checkMethod("os.info", "returns macOS plus non-empty architecture/version strings", async () => {
            const info = await os.info();
            assert(info && typeof info.os === "string" && info.os.toLowerCase().includes("mac"), "os.info must identify macOS");
            assert(typeof info.arch === "string" && info.arch.length > 0 && typeof info.version === "string" && info.version.length > 0, "os.info must include architecture and OS version");
          });

          await checkMethod("os.dirs", "returns an isolated per-run temp path and an app data path", async () => {
            const dirs = await os.dirs();
            assert(dirs && typeof dirs.temp === "string" && dirs.temp.startsWith(tempRoot), "os.dirs.temp must be under this run's temporary directory");
            assert(typeof dirs.data === "string" && dirs.data.length > 0, "os.dirs.data must be a non-empty path");
          });

          await checkMethod("os.sep", "returns the macOS path separator", async () => {
            equal(await os.sep(), "/", "os.sep");
          });

          await checkMethod("os.eol", "returns the macOS line ending", async () => {
            equal(await os.eol(), "\n", "os.eol");
          });

          await checkMethod("os.locale", "returns a non-empty system locale string", async () => {
            const locale = await os.locale();
            assert(typeof locale === "string" && locale.length > 0, "os.locale must return a non-empty locale string");
          });
          return pid;
        }

        async function testResource() {
          const resource = Niva.api.resource;
          await checkMethod("resource.exists", "finds a file in the isolated debug resource tree", async () => {
            equal(await resource.exists("headless-resource.txt"), true, "resource.exists for fixture resource");
          });

          await checkMethod("resource.read", "streams and decodes the isolated fixture resource", async () => {
            equal(await resource.read("headless-resource.txt", "utf8"), "headless-resource-ok\n", "resource.read");
          });
        }

        async function testFs(fsRoot) {
          const fs = Niva.api.fs;
          const work = `${fsRoot}/work`;
          const simpleDir = `${work}/simple`;
          const nestedDir = `${work}/nested/a/b`;
          const file = `${simpleDir}/sample.txt`;
          const copied = `${simpleDir}/copy.txt`;
          const moved = `${nestedDir}/moved.txt`;

          await checkMethod("fs.exists", "observes missing, created, moved, and removed paths", async () => {
            equal(await fs.exists(work), false, "fs.exists before setup");
          });

          await checkMethod("fs.createDir", "creates temporary directories", async () => {
            await fs.createDir(work);
            await fs.createDir(simpleDir);
            assert(await fs.exists(work) && await fs.exists(simpleDir), "fs.createDir must create both direct temporary directories");
          });

          await checkMethod("fs.createDirAll", "creates nested temporary directories", async () => {
            await fs.createDirAll(nestedDir);
            assert(await fs.exists(nestedDir), "fs.createDirAll must create the nested leaf directory");
          });

          const firstText = "headless-alpha\n";
          const finalText = `${firstText}headless-beta\n`;
          await checkMethod("fs.write", "writes a new file under the temporary fixture root", async () => {
            await fs.write(file, firstText, "utf8");
          });

          await checkMethod("fs.read", "reads exact UTF-8 file contents from the temporary fixture root", async () => {
            equal(await fs.read(file, "utf8"), firstText, "fs.read initial content");
          });

          await checkMethod("fs.append", "appends UTF-8 content and preserves the preceding bytes", async () => {
            await fs.append(file, "headless-beta\n", "utf8");
            equal(await fs.read(file, "utf8"), finalText, "fs.append readback");
          });

          await checkMethod("fs.stat", "reports file type and exact byte size", async () => {
            const stat = await fs.stat(file);
            assert(stat.isFile && !stat.isDir && stat.size === new TextEncoder().encode(finalText).length, "fs.stat must report the file type and exact byte length");
            assert((await fs.stat(work)).isDir && (await fs.stat(simpleDir)).isDir && (await fs.stat(nestedDir)).isDir, "fs.stat must identify fixture directories");
          });

          await checkMethod("fs.copy", "copies the fixture file and preserves exact contents", async () => {
            await fs.copy(file, copied);
            equal(await fs.read(copied, "utf8"), finalText, "fs.copy readback");
          });

          await checkMethod("fs.move", "moves the fixture file, removes its source, and preserves contents", async () => {
            await fs.move(copied, moved);
            equal(await fs.exists(copied), false, "fs.move source removal");
            equal(await fs.read(moved, "utf8"), finalText, "fs.move destination readback");
          });

          await checkMethod("fs.readDir", "lists direct files in the isolated directory", async () => {
            const directEntries = await fs.readDir(simpleDir);
            assert(directEntries.includes("sample.txt") && !directEntries.includes("moved.txt"), "fs.readDir must list only direct fixture files");
          });

          await checkMethod("fs.readDirAll", "lists recursive file paths under the isolated directory", async () => {
            const recursiveEntries = await fs.readDirAll(work);
            const recursiveSet = new Set(recursiveEntries);
            assert(recursiveSet.has("simple/sample.txt") && recursiveSet.has("nested/a/b/moved.txt"), "fs.readDirAll must list recursive file paths");
          });

          await checkMethod("fs.remove", "removes fixture files and confirms their paths are absent", async () => {
            await fs.remove(file);
            await fs.remove(moved);
            equal(await fs.exists(file), false, "fs.remove source");
            equal(await fs.exists(moved), false, "fs.remove moved file");
          });
        }

        async function run(data) {
          const { group, progressUrl, fsRoot } = data;
          runProgressUrl = progressUrl;
          let pid = null;
          let resourcePath = null;
          let fsContents = null;
          if (group === "process-os" || group === "all-sequential") pid = await testProcessOs(data);
          if (group === "resource" || group === "all-sequential") {
            await testResource();
            resourcePath = "headless-resource.txt";
          }
          if (group === "fs" || group === "all-sequential") {
            await testFs(fsRoot);
            fsContents = "removed";
          }
          if (!["process-os", "resource", "fs", "all-sequential"].includes(group)) {
            throw new Error(`unknown headless group: ${group}`);
          }
          const result = { group, coverage: covered.slice() };
          if (pid !== null) result.pid = pid;
          if (resourcePath !== null) result.resourcePath = resourcePath;
          if (fsContents !== null) result.fsContents = fsContents;
          await boundedPhase("headless-result", "result-send", Date.now() + 5000, () => send("headless-result", result));
        }

        async function handle(message) {
          if (!message || message.name !== "headless-command") return;
          const data = message.data || {};
          try {
            if (data.command === "run" && !running) {
              running = true;
              await run(data);
            } else if (data.command === "echo") {
              await send("headless-echo-result", { nonce: data.nonce });
            } else if (data.command === "exit") {
              await send("headless-exit-started", { coverage: covered.map(item => item.method) });
              setTimeout(() => Niva.api.process.exit().catch(() => {}), 250);
            }
          } catch (error) {
            const details = safeError(error, data);
            await boundedPhase(activeMethod || "headless-error", "error-send", Date.now() + 3000, () => send("headless-error", details)).catch(() => {});
          }
        }

        Niva.addEventListener("host:message", (_name, message) => handle(message));
        send("headless-ready", { path: location.pathname }).catch(async error => {
          await send("headless-error", safeError(error, null));
        });
      })();
    </script>
  </body>
</html>
