<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Niva macOS API smoke secondary</title>
  </head>
  <body>
    <h1>Secondary navigation page</h1>
    <script>
      (() => {
        async function send(name, data) {
          const payload = JSON.stringify({ protocol: "niva-fixture", version: 1, event: "message", name, data });
          return Niva.window.sendMessage(payload, 0);
        }

        async function reportReady() {
          try {
            await send("secondary-ready", {
              url: await Niva.webview.url(),
              canGoBack: await Niva.webview.canGoBack(),
              canGoForward: await Niva.webview.canGoForward(),
            });
          } catch (error) {
            await send("secondary-error", { message: String(error) });
          }
        }

        window.addEventListener("pageshow", () => {
          setTimeout(reportReady, 150);
        });
      })();
    </script>
  </body>
</html>
