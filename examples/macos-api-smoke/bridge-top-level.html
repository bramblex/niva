<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Niva top-level bridge smoke</title></head>
  <body>
    <h1>Niva top-level bridge smoke</h1>
    <script src="fixture-protocol.js"></script>
    <script>
      (() => {
        const fs = require("node:fs/promises");
        const coverage = [];
        const assert = (condition, message) => { if (!condition) throw new Error(message); };
        const record = (method, assertion) => coverage.push({ method, assertion });
        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        async function until(read, expected, label) {
          for (let i = 0; i < 40; i += 1) {
            if (read() === expected) return;
            await sleep(50);
          }
          throw new Error(`${label} did not become ${expected}`);
        }

        async function run(tempRoot) {
          const id = await Niva.window.current();
          let hits = 0;
          const listener = (_name, data) => { if (data?.message?.startsWith("bridge-event-")) hits += 1; };
          Niva.addEventListener("window.message", listener);
          await Niva.window.sendMessage("bridge-event-1", id);
          await until(() => hits, 1, "registered native event listener");
          record("Niva.addEventListener", "receives a real native window.message event");
          Niva.removeEventListener("window.message", listener);
          await Niva.window.sendMessage("bridge-event-2", id);
          await sleep(150);
          assert(hits === 1, "removed listener still received a native event");
          record("Niva.removeEventListener", "stops the native event callback");
          Niva.addEventListener("window.message", listener);
          Niva.removeAllEventListeners("window.message");
          await Niva.window.sendMessage("bridge-event-3", id);
          await sleep(150);
          assert(hits === 1, "removeAll left a native event callback");
          record("Niva.removeAllEventListeners", "clears the event's remaining listeners");

          assert(Number.isFinite(await Niva.bridge.call("os.freemem", [])), "direct native call returned invalid memory data");
          record("Niva.bridge.call", "dispatches a direct native call and resolves its result");
          assert(Number.isFinite(Niva.bridge.callSync("os.freemem", [])), "sync native call returned invalid memory data");
          let deniedSyncUi = false;
          try { Niva.bridge.callSync("window.current", []); } catch (_) { deniedSyncUi = true; }
          assert(deniedSyncUi, "sync bridge must reject UI methods");
          record("Niva.bridge.callSync", "returns synchronous OS values and rejects UI handlers");

          const blobs = [];
          const readStream = Niva.bridge.stream("resource.readStream", ["probe.txt"], {
            onBlob: (blob) => blobs.push(blob),
          });
          await readStream.promise;
          const text = (await Promise.all(blobs.map(blob => blob.text()))).join("");
          assert(text === "niva-top-level-probe\n", `native stream returned ${JSON.stringify(text)}`);
          record("Niva.bridge.stream", "receives and decodes a native resource stream");

          const file = `${tempRoot}/top-level-stream.txt`;
          try {
            const writeStream = Niva.bridge.stream("fs.writeStream", [file], {});
            assert(Niva.bridge.streamSend(writeStream.id, new TextEncoder().encode("stream-send-ok"), true), "streamSend rejected the owned call");
            await writeStream.promise;
            assert(await fs.readFile(file, "utf8") === "stream-send-ok", "native streamed write did not preserve bytes");
          } finally { await fs.rm(file, { force: true }).catch(() => {}); }
          record("Niva.bridge.streamSend", "sends END-terminated bytes into a native stream and reads them back");
          await NivaFixture.send("bridge-top-level-result", { coverage });
        }

        NivaFixture.onCommand("bridge-top-level-command", (data) => {
          run(data.tempRoot).catch(error =>
            NivaFixture.send("bridge-top-level-error", { message: error?.message || String(error), coverage }).catch(() => {}));
        });
        window.addEventListener("load", () => setTimeout(async () => {
          await NivaFixture.ready("bridge-top-level", { url: location.href });
          await NivaFixture.send("bridge-top-level-ready", { url: location.href });
        }, 100));
      })();
    </script>
  </body>
</html>
