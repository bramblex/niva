<!doctype html>
<html><head><script src="fixture-protocol.js"></script></head><body><h1>Niva Windows smoke</h1><script>
  (async () => {
    try {
      await NivaFixture.ready("windows-smoke");
      NivaFixture.onCommand("fixture-exit", (code) => NivaFixture.exit(code));
      Niva.addEventListener("menu.clicked", (_name, id) => {
        NivaFixture.send("menu-clicked", { id });
      });
      Niva.addEventListener("shortcut.emit", (_name, id) => {
        NivaFixture.send("shortcut-fired", { id });
      });
      const iframeResult = new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error("iframe timeout")), 10000);
        const onMessage = event => {
          if (event.data?.kind === "iframe") {
            clearTimeout(timer);
            window.removeEventListener("message", onMessage);
            resolve(event.data);
          }
        };
        window.addEventListener("message", onMessage);
      });
      const frame = document.createElement("iframe");
      frame.src = "iframe.html";
      document.body.append(frame);
      const crossResult = new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error("cross-origin iframe timeout")), 10000);
        window.addEventListener("message", event => {
          if (event.data?.kind === "cross") {
            clearTimeout(timer);
            resolve(event.data);
          }
        });
      });
      const cross = document.createElement("iframe");
      cross.src = "data:text/html," + encodeURIComponent(await (await fetch("cross.html")).text());
      document.body.append(cross);
      const resource = await fetch("probe.txt");
      const process = require("node:process");
      const cwd = process.cwd();
      const fsBase = await Niva.webview.baseFileSystemUrl();
      const filePath = cwd.replaceAll("\\", "/") + "/examples/windows-smoke/probe.txt";
      const fsResource = await fetch(fsBase + encodeURIComponent(filePath));
      const pathModule = await import("path");
      const fsModule = await import("fs/promises");
      const urlModule = await import("url");
      const assertModule = require("assert/strict");
      const compatText = (await fsModule.readFile(filePath, "utf8")).trim();
      assertModule.equal(compatText, "resource-ok");
      const windowsPath = pathModule.default.join(cwd, "examples", "windows-smoke", "probe.txt");
      const fileUrlRoundTrip = urlModule.fileURLToPath(urlModule.pathToFileURL(windowsPath)) === windowsPath;
      const namespacedPath = pathModule.default.toNamespacedPath(windowsPath).startsWith("\\\\?\\");
      await Niva.window.setMenu([{ label: "Smoke", children: [{ type: "item", id: 7, label: "Ping" }] }]);
      const menuShown = await Niva.window.isMenuVisible();
      await Niva.window.hideMenu();
      const menuHidden = !(await Niva.window.isMenuVisible());
      await Niva.window.showMenu();
      const menuRestored = await Niva.window.isMenuVisible();
      const shortcutId = await Niva.shortcut.register("Ctrl+Alt+Shift+F12");
      const childId = await Niva.window.open({
        entry: "child.html", title: "Niva Windows owned child",
        size: { width: 300, height: 200 }, ownerWindow: 0, visible: false,
      });
      await NivaFixture.send("smoke", {
        origin: location.origin,
        windowId: await Niva.window.current(),
        os: Niva.os.info.os,
        resourceStatus: resource.status,
        resourceText: (await resource.text()).trim(),
        fsStatus: fsResource.status,
        fsText: (await fsResource.text()).trim(),
        fsBase,
        runtimeModules: {
          path: pathModule.default.join("a", "b"),
          fsText: compatText,
          assert: typeof assertModule.equal,
          fileUrlRoundTrip,
          namespacedPath,
        },
        menu: { shown: menuShown, hidden: menuHidden, restored: menuRestored },
        shortcutId,
        childId,
        windows: await Niva.window.list(),
        iframe: await iframeResult,
        crossIframe: await crossResult,
      });
    } catch (error) {
      await NivaFixture.send("smoke-error", { message: String(error), stack: error?.stack });
    }
  })();
</script></body></html>
